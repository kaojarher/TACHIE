<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0">
  <title>PNG VTuber 完整系統 - 編輯器與匯出</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #1a1e2b;
      font-family: 'Segoe UI', 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .app {
      width: 100%;
      max-width: 1100px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 2.5rem;
      padding: 2rem 1.8rem;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    h1 { text-align: center; color: #f0dbb0; font-weight: 600; font-size: clamp(1.7rem, 5vw, 2.4rem); }
    .upload-area {
      background: rgba(25,28,38,0.7);
      border: 2px dashed rgba(255,255,255,0.3);
      border-radius: 2rem;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover, .drag-over { border-color:#f9b84a; background:rgba(249,184,74,0.1); }
    .editor-layout { display: flex; flex-wrap: wrap; gap: 1.8rem; }
    .canvas-container {
      flex: 2; min-width: 300px; position: relative; background: #0f1117;
      border-radius: 1.8rem; overflow: hidden; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.7); user-select: none;
    }
    #mainImage { max-width: 100%; max-height: 70vh; display: block; pointer-events: none; }
    #drawCanvas {
      position: absolute; top:0; left:0; width:100%; height:100%; z-index:10;
      touch-action: none; cursor: crosshair;
    }
    .side-panel {
      flex: 1; min-width: 260px; background: rgba(20,22,30,0.8); border-radius: 1.5rem;
      padding: 1.3rem; backdrop-filter: blur(12px); display: flex; flex-direction: column;
      gap: 1rem; color: #ddd; border: 1px solid rgba(255,255,255,0.1); max-height: 70vh; overflow-y: auto;
    }
    .part-list {
      list-style: none; max-height: 150px; overflow-y: auto; padding: 0.3rem;
      background: rgba(0,0,0,0.3); border-radius: 0.8rem; min-height: 60px;
    }
    .empty-list-message { color: #aaa; font-style: italic; padding: 1rem; text-align: center; }
    .part-item {
      display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.05);
      border-radius: 0.7rem; padding: 0.5rem; margin-bottom: 0.4rem;
    }
    .part-item select {
      background: #2a2f3f; border: 1px solid #4a5060; color: #fff;
      padding: 0.3rem; border-radius: 0.4rem; font-size: 0.85rem; flex: 1;
    }
    .part-item button {
      background: #c0392b; border: none; color: white; padding: 0.2rem 0.5rem;
      border-radius: 0.4rem; cursor: pointer; transition: background 0.15s;
    }
    .part-item button:hover { background: #e74c3c; }
    .actions-grid { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .action-btn {
      background: #3a4055; border: none; color: #f0dbb0; padding: 0.5rem 0.9rem;
      border-radius: 2rem; cursor: pointer; font-size: 0.9rem; font-weight: 500;
      transition: background 0.15s, color 0.15s;
    }
    .action-btn:hover { background:#f9b84a; color:#1a1e2b; }
    /* 預覽提示 toast */
    .toast {
      position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(249,184,74,0.95); color: #1a1e2b; padding: 0.6rem 1.4rem;
      border-radius: 2rem; font-weight: 600; font-size: 0.9rem;
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 9999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .btn-row { display: flex; gap: 0.8rem; flex-wrap: wrap; justify-content: center; margin-top: 0.3rem; }
    .btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      padding: 0.6rem 1.2rem; border-radius: 2rem; color: #f0e0c0; cursor: pointer;
      font-weight: 600; transition: opacity 0.15s;
    }
    .btn-primary { background:#f9b84a; border-color:#f9b84a; color:#1a1e2b; }
    .btn:hover { opacity:0.85; }
    .note { font-size:0.8rem; color:#aaa; }
    .setting-row { display: flex; align-items: center; gap: 0.5rem; margin: 0.3rem 0; }
    .setting-row label { width: 70px; font-size:0.85rem; }
    input[type=range] { width: 100px; cursor: pointer; }
    @media (max-width: 700px) { .editor-layout { flex-direction: column; } }
    /* 組合動作區塊 */
    .combo-section {
      background: rgba(15,18,28,0.7);
      border-radius: 1.5rem;
      padding: 1.4rem 1.6rem;
      border: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .combo-section h3 { color: #f0dbb0; font-size: 1rem; font-weight: 600; }
    .combo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.8rem;
    }
    .combo-card {
      background: rgba(255,255,255,0.05);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: 1.1rem;
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      position: relative;
      overflow: hidden;
    }
    .combo-card::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: inherit;
    }
    .combo-card:hover { transform: translateY(-2px); border-color: var(--combo-color, #f9b84a); box-shadow: 0 6px 20px rgba(0,0,0,0.4); }
    .combo-card:hover::before { opacity: 0.08; background: var(--combo-color, #f9b84a); }
    .combo-card.playing { animation: comboPulse 0.5s ease; border-color: var(--combo-color, #f9b84a); }
    @keyframes comboPulse { 0%{transform:scale(1)} 50%{transform:scale(1.04)} 100%{transform:scale(1)} }
    .combo-card .combo-icon { font-size: 1.6rem; line-height: 1; }
    .combo-card .combo-name { font-weight: 700; font-size: 0.9rem; color: #f0dbb0; }
    .combo-card .combo-desc { font-size: 0.75rem; color: #aaa; }
    .combo-tag {
      display: inline-block;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      font-weight: 600;
      margin-top: 0.1rem;
      color: #1a1e2b;
    }
  </style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app">
  <h1>🎭 完整 PNG VTuber 系統</h1>

  <div id="uploadSection" class="upload-area" role="button" tabindex="0" aria-label="點擊或拖放圖片上傳">
    <div style="font-size:2.4rem;" aria-hidden="true">🖼️</div>
    <div>點擊或拖放圖片上傳</div>
    <div class="note">支援 PNG / JPG / WebP</div>
    <input type="file" id="fileInput" accept="image/*" aria-label="選擇圖片檔案">
  </div>

  <div id="editorSection" style="display: none; flex-direction: column; gap: 1.5rem;">
    <div class="editor-layout">
      <div class="canvas-container" id="canvasContainer">
        <img id="mainImage" src="" alt="立繪圖片" crossorigin="anonymous">
        <canvas id="drawCanvas" aria-label="部位框選區域" role="img"></canvas>
      </div>
      <div class="side-panel" role="complementary" aria-label="設定面板">
        <div><strong>📌 部位列表</strong></div>
        <ul class="part-list" id="partList" aria-label="已標記部位列表"></ul>
        <div class="note">拖曳繪製矩形，選擇對應部位</div>
        <div><strong>🎭 即時動態設定</strong></div>
        <div class="setting-row">
          <label for="followStrength">跟隨強度</label>
          <input type="range" id="followStrength" min="0" max="20" value="8" step="1" aria-valuetext="8">
          <span id="followValue" aria-live="polite">8</span>
        </div>
        <div class="setting-row">
          <label for="blinkInterval">眨眼間隔</label>
          <input type="range" id="blinkInterval" min="1" max="8" value="3" step="0.5" aria-valuetext="3秒">
          <span id="blinkValue" aria-live="polite">3</span>秒
        </div>
        <div class="setting-row">
          <label for="micSensitivity">麥克風靈敏</label>
          <input type="range" id="micSensitivity" min="1" max="10" value="5" step="0.5" aria-valuetext="5">
          <span id="micValue" aria-live="polite">5</span>
        </div>
        <div><strong>🎬 可用動作</strong> <span class="note">(依部位自動顯示)</span></div>
        <div class="actions-grid" id="actionButtons" aria-label="可用動作按鈕"></div>
        <div class="btn-row">
          <button class="btn" id="clearPartsBtn" aria-label="清除所有部位">🗑️ 清除</button>
          <button class="btn" id="resetUploadBtn" aria-label="重新上傳圖片">🔄 重傳</button>
        </div>
      </div>
    </div>
    <!-- 六組 VTuber 動作組合 -->
    <div class="combo-section" id="comboSection">
      <h3>🎬 六組 VTuber 常見動作組合 <span class="note">（匯出後可直接套用）</span></h3>
      <div class="combo-grid" id="comboGrid"></div>
      <div class="note">💡 點擊卡片可預覽動作效果說明；匯出後在播放器中實際觸發</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="exportHtmlBtn" aria-label="匯出完整 VTuber HTML 檔案">📥 匯出完整 VTuber HTML</button>
    </div>
    <div class="note" style="text-align:center;">* 匯出的 HTML 包含六組動作組合，依部位自動啟用</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ---------- DOM refs ----------
  const uploadSection   = document.getElementById('uploadSection');
  const fileInput       = document.getElementById('fileInput');
  const editorSection   = document.getElementById('editorSection');
  const mainImage       = document.getElementById('mainImage');
  const drawCanvas      = document.getElementById('drawCanvas');
  const canvasContainer = document.getElementById('canvasContainer');
  const partList        = document.getElementById('partList');
  const actionButtonsDiv= document.getElementById('actionButtons');
  const clearPartsBtn   = document.getElementById('clearPartsBtn');
  const resetUploadBtn  = document.getElementById('resetUploadBtn');
  const exportHtmlBtn   = document.getElementById('exportHtmlBtn');
  const followStrength  = document.getElementById('followStrength');
  const followValue     = document.getElementById('followValue');
  const blinkInterval   = document.getElementById('blinkInterval');
  const blinkValue      = document.getElementById('blinkValue');
  const micSensitivity  = document.getElementById('micSensitivity');
  const micValue        = document.getElementById('micValue');
  const toastEl         = document.getElementById('toast');

  // ---------- 快取 canvas context ----------
  const ctx = drawCanvas.getContext('2d');

  // ---------- 狀態 ----------
  let imageBase64 = null;
  let parts = [];
  let isDrawing = false, startX = 0, startY = 0, currentRect = null;
  let resizeObserver = null;
  let toastTimer = null;

  const partNames = ['頭部','左眼','右眼','嘴巴','身體','左手','右手','左腿','右腿','其他'];

  const actionRequirements = {
    nod:          { label: '🙆 點頭', needs: ['頭部'] },
    blink:        { label: '😉 眨眼', needs: ['左眼','右眼'], any: true },
    wave:         { label: '👋 揮手', needs: ['左手','右手'], any: true },
    walk:         { label: '🚶 走路', needs: ['左腿','右腿'], any: true },
    breathToggle: { label: '🫁 呼吸', needs: ['身體'] },
    happy:        { label: '😊 微笑', needs: ['嘴巴'] },
    angry:        { label: '😠 生氣', needs: ['嘴巴'] },
    surprise:     { label: '😲 驚訝', needs: ['嘴巴'] }
  };

  // ---------- 六組 VTuber 常見動作組合 ----------
  // needs 為 any OR 邏輯：只要有其中一個部位就顯示
  const comboActions = [
    {
      key: 'combo_greet',
      label: '👋 打招呼',
      icon: '👋',
      desc: '揮手 + 點頭',
      color: '#4ecdc4',
      actions: ['wave','nod'],
      needs: ['左手','右手','頭部'],
      any: true
    },
    {
      key: 'combo_happy',
      label: '🌟 開心歡呼',
      icon: '🌟',
      desc: '微笑 + 眨眼 + 點頭',
      color: '#f9b84a',
      actions: ['happy','blink','nod'],
      needs: ['嘴巴','左眼','右眼','頭部'],
      any: true
    },
    {
      key: 'combo_surprise',
      label: '😱 驚訝反應',
      icon: '😱',
      desc: '驚訝 + 跳動',
      color: '#e67e22',
      actions: ['surprise','jump'],
      needs: ['嘴巴'],
      any: true
    },
    {
      key: 'combo_shy',
      label: '😳 害羞緊張',
      icon: '😳',
      desc: '快速眨眼 + 小幅抖動',
      color: '#e91e8c',
      actions: ['multiBlink','shake'],
      needs: ['左眼','右眼','頭部'],
      any: true
    },
    {
      key: 'combo_bye',
      label: '👋 說再見',
      icon: '🥹',
      desc: '大幅揮手 + 點頭',
      color: '#9b59b6',
      actions: ['bigWave','nod'],
      needs: ['左手','右手','頭部'],
      any: true
    },
    {
      key: 'combo_idle',
      label: '💤 直播待機',
      icon: '💤',
      desc: '呼吸 + 緩慢搖擺',
      color: '#3498db',
      actions: ['breathToggle','sway'],
      needs: ['身體','頭部'],
      any: true
    }
  ];

  // ---------- Toast 提示（取代 alert 預覽）----------
  function showToast(msg, duration = 2000) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  // ---------- 上傳 ----------
  uploadSection.addEventListener('click', e => {
    if (e.target !== fileInput) fileInput.click();
  });
  uploadSection.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
  });
  uploadSection.addEventListener('dragover', e => {
    e.preventDefault();
    uploadSection.classList.add('drag-over');
  });
  uploadSection.addEventListener('dragleave', e => {
    e.preventDefault();
    uploadSection.classList.remove('drag-over');
  });
  uploadSection.addEventListener('drop', e => {
    e.preventDefault();
    uploadSection.classList.remove('drag-over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  });

  function handleFile(file) {
    if (!file.type.startsWith('image/')) {
      showToast('⚠️ 請上傳圖片檔案（PNG / JPG / WebP）');
      return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      imageBase64 = e.target.result;
      mainImage.onload = () => {
        uploadSection.style.display = 'none';
        editorSection.style.display = 'flex';
        parts = [];
        renderPartList();
        setupCanvas();
        renderActionButtons();
      };
      mainImage.src = imageBase64;
    };
    reader.onerror = () => showToast('⚠️ 讀取檔案失敗，請再試一次');
    reader.readAsDataURL(file);
  }

  // ---------- Canvas 繪圖 ----------
  function setupCanvas() {
    // 解除前一次的 ResizeObserver（避免重複監聽）
    if (resizeObserver) resizeObserver.disconnect();

    function resize() {
      const rect = canvasContainer.getBoundingClientRect();
      drawCanvas.width  = rect.width;
      drawCanvas.height = rect.height;
      redrawCanvas();
    }

    // 優先使用 ResizeObserver 精準監聽容器尺寸
    if (typeof ResizeObserver !== 'undefined') {
      resizeObserver = new ResizeObserver(() => resize());
      resizeObserver.observe(canvasContainer);
    } else {
      window.addEventListener('resize', resize);
    }
    resize();

    function getCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const src  = e.touches ? e.touches[0] : e;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    function onStart(e) {
      e.preventDefault();
      const c = getCoords(e);
      startX = c.x; startY = c.y;
      isDrawing   = true;
      currentRect = { x: startX, y: startY, w: 0, h: 0 };
    }

    function onMove(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const c = getCoords(e);
      currentRect.w = c.x - startX;
      currentRect.h = c.y - startY;
      redrawCanvas();
      drawTempRect(currentRect);
    }

    function onEnd(e) {
      if (!isDrawing) return;
      e.preventDefault();
      isDrawing = false;
      if (Math.abs(currentRect.w) > 8 && Math.abs(currentRect.h) > 8) {
        const cw = drawCanvas.width, ch = drawCanvas.height;
        let x = currentRect.x, y = currentRect.y;
        let w = currentRect.w, h = currentRect.h;
        if (w < 0) { x += w; w = -w; }
        if (h < 0) { y += h; h = -h; }
        const px = (x / cw) * 100, py = (y / ch) * 100;
        const pw = (w / cw) * 100, ph = (h / ch) * 100;
        parts.push({
          id: Date.now(),
          name: '請選擇',
          x: Math.min(100, Math.max(0, px)),
          y: Math.min(100, Math.max(0, py)),
          w: Math.min(100 - px, pw),
          h: Math.min(100 - py, ph)
        });
        renderPartList();
        renderActionButtons();
      }
      currentRect = null;
      redrawCanvas();
    }

    function onCancel() {
      if (isDrawing) { isDrawing = false; currentRect = null; redrawCanvas(); }
    }

    drawCanvas.addEventListener('mousedown',  onStart);
    drawCanvas.addEventListener('mousemove',  onMove);
    drawCanvas.addEventListener('mouseup',    onEnd);
    drawCanvas.addEventListener('mouseleave', onCancel);
    drawCanvas.addEventListener('touchstart', onStart,  { passive: false });
    drawCanvas.addEventListener('touchmove',  onMove,   { passive: false });
    drawCanvas.addEventListener('touchend',   onEnd);
    drawCanvas.addEventListener('touchcancel',onCancel);
  }

  function redrawCanvas() {
    ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    parts.forEach(p => {
      const x = (p.x / 100) * drawCanvas.width;
      const y = (p.y / 100) * drawCanvas.height;
      const w = (p.w / 100) * drawCanvas.width;
      const h = (p.h / 100) * drawCanvas.height;
      ctx.strokeStyle = '#f9b84a';
      ctx.lineWidth   = 2;
      ctx.strokeRect(x, y, w, h);
      ctx.fillStyle   = 'rgba(249,184,74,0.2)';
      ctx.fillRect(x, y, w, h);
    });
  }

  function drawTempRect(rect) {
    if (!rect) return;
    ctx.strokeStyle = '#ff6666';
    ctx.lineWidth   = 2;
    ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
  }

  // ---------- 部位工具 ----------
  function getSelectedPartNames() {
    return new Set(parts.map(p => p.name).filter(n => n !== '請選擇' && n !== '其他'));
  }

  function isActionAvailable(actionKey) {
    const selected = getSelectedPartNames();
    const req = actionRequirements[actionKey];
    if (!req) return false;
    return req.any
      ? req.needs.some(n => selected.has(n))
      : req.needs.every(n => selected.has(n));
  }

  // ---------- 部位列表渲染 ----------
  function renderPartList() {
    partList.innerHTML = '';
    if (parts.length === 0) {
      const empty = document.createElement('div');
      empty.className   = 'empty-list-message';
      empty.textContent = '尚無部位，請在圖片上拖曳';
      partList.appendChild(empty);
      return;
    }

    // 使用 part.id 作為穩定識別符，避免 indexOf 問題
    parts.forEach(p => {
      const li  = document.createElement('li');
      li.className = 'part-item';

      const sel = document.createElement('select');
      sel.setAttribute('aria-label', '選擇部位名稱');

      const defOpt = document.createElement('option');
      defOpt.value       = '';
      defOpt.textContent = '-- 選擇 --';
      defOpt.disabled    = true;
      if (p.name === '請選擇') defOpt.selected = true;
      sel.appendChild(defOpt);

      partNames.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n; opt.textContent = n;
        if (p.name === n) opt.selected = true;
        sel.appendChild(opt);
      });

      sel.addEventListener('change', e => {
        // 用 id 找到正確的 part，不依賴 idx
        const target = parts.find(pp => pp.id === p.id);
        if (target) { target.name = e.target.value; renderActionButtons(); }
      });

      const del = document.createElement('button');
      del.textContent = '✕';
      del.setAttribute('aria-label', '刪除此部位');
      del.addEventListener('click', () => {
        const idx = parts.findIndex(pp => pp.id === p.id);
        if (idx !== -1) parts.splice(idx, 1);
        renderPartList();
        redrawCanvas();
        renderActionButtons();
      });

      li.appendChild(sel);
      li.appendChild(del);
      partList.appendChild(li);
    });
  }

  // ---------- 六組組合動作卡片渲染 ----------
  function renderComboCards() {
    const comboGrid = document.getElementById('comboGrid');
    if (!comboGrid) return;

    // 延遲 revoke，確保瀏覽器已觸發下載
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    showToast('✅ 匯出成功！');
  });

})();
</script>
</body>
